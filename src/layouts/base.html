<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="{{ page.robots }}">
  <link rel="canonical" href="{{ page.url }}">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="{{ page.ogType }}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url }}">
  <meta property="og:image" content="{{ page.ogImage }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="{{ page.ogImage }}">

  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Fonts loaded without blocking render; metric-matched fallbacks in style.css prevent layout shift -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/assets/css/style.css">

  <script>
    document.documentElement.classList.add('js');
    try { var m = localStorage.getItem('eltek-mode'); if (m === 'home' || m === 'industry') document.documentElement.dataset.heroMode = m; } catch (e) {}
  </script>
  <script src="/assets/js/main.js" defer></script>
  {{ schema }}
</head>
<body>
  <!--site-chrome-->
  <a href="#main" class="sr-only z-[100] rounded-lg bg-orange px-4 py-3 font-bold text-navy focus:not-sr-only focus:fixed focus:left-4 focus:top-4">Skip to content</a>
  {{> header}}<!--/site-chrome-->
  <main id="main">
{{content}}
  </main>
  <!--site-chrome-->{{> footer}}
  {{> action-bar}}<!--/site-chrome-->
</body>
</html>
